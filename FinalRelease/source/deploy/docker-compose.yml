services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: papermate
      POSTGRES_USER: papermate
      # Set PAPERMATE_POSTGRES_PASSWORD outside Git, for example in deploy/.env.
      POSTGRES_PASSWORD: ${PAPERMATE_POSTGRES_PASSWORD:?set PAPERMATE_POSTGRES_PASSWORD in the deploy environment}
    volumes:
      - papermate_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papermate -d papermate"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    env_file:
      - ../backend/.env
    environment:
      PAPERMATE_ENV: prod
      PAPERMATE_DB_PASSWORD: ${PAPERMATE_POSTGRES_PASSWORD:?set PAPERMATE_POSTGRES_PASSWORD in the deploy environment}
      PAPERMATE_CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      PAPERMATE_ENABLE_DOCS: "false"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  web:
    image: nginx:1.27-alpine
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  papermate_pg:
